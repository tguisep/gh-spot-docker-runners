[project]
name = "gh-spot-docker-runners"
version = "0.3.0"
description = "Self-hosted GitHub Actions runners on Docker, with full lifecycle management and continuous reconciliation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas" }]
keywords = ["github-actions", "self-hosted-runner", "docker", "ci", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "docker>=7.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[project.scripts]
ghspot = "ghspot.interfaces.cli.main:app"

[project.urls]
Homepage = "https://github.com/tguisep/gh-spot-docker-runners"
Issues = "https://github.com/tguisep/gh-spot-docker-runners/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghspot"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print()
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "B008",      # typer/fastapi depend on call-in-default
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/ghspot/interfaces/cli/**" = ["T20"]
"deploy/ansible/test/**" = ["T20"]   # a test script: its report is its output

[tool.ruff.lint.isort]
known-first-party = ["ghspot"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "docker: requires a reachable Docker daemon",
    "e2e: requires a real GitHub token and a throwaway repository",
]

[tool.coverage.run]
source = ["src/ghspot"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
