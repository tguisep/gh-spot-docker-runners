# The smallest configuration the role will accept. No secret at all — a credential still
# needs a name for a pool with no `github` key to find, but its token or App key can come
# from the environment at runtime instead of through Ansible.
ghspot_github_credentials:
  - name: default
ghspot_poll_interval: 15s
ghspot_state_db: /var/lib/ghspot/state.db
ghspot_log_level: INFO
ghspot_api_bind: ""
ghspot_host: ""
ghspot_housekeeping:
  enabled: true
  every: 1h
  containers_older_than: 1h
  images_older_than: 24h
  volumes: true
  build_cache_older_than: 24h
  keep_build_cache: 10g
ghspot_pools:
  - name: default
    repository: tguisep/my-project
    labels: [self-hosted, linux, x64]
    container:
      image: ghspot/runner:ubuntu-24.04
