name: Ansible

# The role restates the daemon's configuration schema in a Jinja template, and nothing fails
# when the two drift: the role keeps rendering a file the daemon quietly ignores, and it
# surfaces months later as a setting that does nothing. This is what turns that into a red
# build.

on:
  push:
    branches: [main]
    paths:
      - "deploy/ansible/**"
      - "src/ghspot/infrastructure/config/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    paths:
      - "deploy/ansible/**"
      - "src/ghspot/infrastructure/config/**"
      - ".github/workflows/ansible.yml"

  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run it"
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      runner: ${{ inputs.runner || 'auto' }}

  check:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-extras

      # Run through uvx rather than installed: these are tools, not dependencies, and adding
      # them to pyproject would make every contributor carry Ansible to run the unit tests.
      - name: ansible-lint
        run: uvx --from ansible-lint ansible-lint deploy/ansible

      - name: Syntax check
        working-directory: deploy/ansible
        run: uvx --from ansible-core ansible-playbook playbook.yml --syntax-check -i inventory/hosts.example.ini

      # The one that earns its keep: render the templates with Ansible itself, then load the
      # result with the daemon's own parser.
      - name: The role renders configuration the daemon accepts
        run: |
          uv pip install ansible-core
          uv run python deploy/ansible/test/render_and_validate.py

  # Hosted, not on the fleet. Molecule starts a privileged systemd container and mounts the
  # host's cgroups; on a self-hosted runner that would be a sibling of the runner rather than
  # a child of it, and the paths it mounts resolve on the host. The same reason packaging is
  # pinned.
  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Converges the role against a container with systemd, runs it a second time and fails
      # if anything changed, then asserts what it was supposed to have done: the package
      # installed, the service account in the docker group, the unit systemd parsed pointing
      # at the binary, and — the point of it — the daemon accepting the configuration the
      # role rendered.
      - name: molecule test
        working-directory: deploy/ansible/roles/ghspot
        run: |
          uvx --from molecule \
              --with 'molecule-plugins[docker]' \
              --with ansible-core \
              --with docker \
              molecule test
