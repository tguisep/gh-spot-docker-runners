# ghspot — installed configuration
#
# Edit this, then: sudo ghspot doctor --config /etc/ghspot/config.toml
#
# Credentials do NOT go here. Put them in /etc/ghspot/env (chmod 600), which the systemd
# unit reads as an EnvironmentFile:
#
#     GHSPOT_GITHUB_TOKEN=github_pat_...
#   or
#     GHSPOT_GITHUB_APP_ID=123456
#     GHSPOT_GITHUB_APP_PRIVATE_KEY=-----BEGIN PRIVATE KEY-----\n...
#
# Setting up either, with the exact permissions needed:
# https://tguisep.github.io/gh-spot-docker-runners/start/authentication/
#
# A fully commented reference lives at /usr/share/doc/ghspot/config.example.toml

# Pools may live one per file in /etc/ghspot/pools.d, the way php-fpm keeps them in
# php-fpm.d. The directory ships empty; drop a file in and uncomment this.
#
# Files are merged, not overridden: every pool found runs, and two of one name is a fatal
# error naming both files. An included file defines pools and nothing else.
#
# Must stay above the first [section] — in TOML a bare key belongs to the table above it.
# include = "/etc/ghspot/pools.d/*.toml"

[github]
# api_url = "https://api.github.com"     # change for GitHub Enterprise Server

[daemon]
poll_interval = "15s"
state_db = "/var/lib/ghspot/state.db"

# What to call this machine in reports.
#
# Several hosts can serve one repository, and each daemon only ever sees its own runners — so
# every number `ghspot stats` prints is about this box alone. Naming it is what lets you put
# two of those reports side by side.
#
# Defaults to the system hostname. Set it when that is meaningless (a cloud instance id) or
# not unique (a container's).
# host = "builders-01"

# Serve the REST API. It has no authentication — keep it on localhost.
# api_bind = "127.0.0.1:8770"

# What this host will take, across every pool at once. max_runners bounds one pool; nothing
# bounds the machine. Unset means unlimited.
#
# [capacity]
# max_containers = 8          # runners across every pool; defaults to the core count
# max_cpus = 12.0             # summed `cpus` of the runners that are up
# max_memory = "24g"
# cpu_high_water = 85         # one-minute load average as a percentage of cores
# memory_high_water = 90      # page cache excluded, since the kernel gives it back

[[pool]]
name = "default"

# CHANGE THIS to a repository you own.
repository = "OWNER/REPOSITORY"

# A job runs here when every label it asks for appears in this list.
labels = ["self-hosted", "linux", "x64"]

# Labels a job must ask for by name before this pool serves it. Worth setting on a scarce
# pool — a GPU, say — because label matching is otherwise a subset rule and a plain job
# would land here.
# requires_labels = ["gpu-a100"]

# How runners are kept, as php-fpm's `pm`: "dynamic" (a warm band, the default), "static"
# (exactly max_runners, never reaped) or "ondemand" (nothing warm). A key that does not apply
# to the mode is refused rather than ignored.
# pm = "dynamic"

# This pool's share of contested capacity when [capacity] bites. A weight, not a rank: 10
# against 5 takes two thirds of the contested slots, interleaved, not all of them. From 1.
# priority = 10

min_idle = 0          # runners kept warm; 1 removes container boot from the first job
# max_idle = 3        # warm runners above this are reaped without waiting out idle_timeout
max_runners = 2       # hard ceiling for this pool
idle_timeout = "10m"
max_job_duration = "2h"

[pool.container]
image = "ghspot/runner:ubuntu-24.04"
cpus = 2.0
memory = "4g"

# Lets jobs run docker build / docker run. A job with socket access has effective root on
# this host: fine for repositories you control, unacceptable for one accepting pull requests
# from forks. See /usr/share/doc/ghspot/README.md.gz and SECURITY.md.
docker_socket = true
