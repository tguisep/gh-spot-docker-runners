name: Release

# Releases are cut by release-please rather than by tagging.
#
# Every merge to main updates a release pull request that accumulates the changelog and the
# version bump. Merging *that* pull request is what cuts the release: release-please creates
# the tag and the GitHub release, and the jobs below attach the packages to it.
#
# release-please lives in this workflow rather than its own because a tag pushed with
# GITHUB_TOKEN deliberately does not trigger other workflows. A separate tag-triggered
# workflow would sit there and never run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Build the packages without releasing anything, at this version."
        required: false
      runner:
        description: "Where to run it"
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  runner:
    uses: ./.github/workflows/select-runner.yml
    with:
      runner: ${{ inputs.runner || 'auto' }}

  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report
        run: |
          if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.tag_name }}; packages follow."
          else
            echo "No release this time. The release pull request has been opened or updated."
          fi

  build:
    name: Build ${{ matrix.arch }} package
    needs: [release-please]
    # `always()` so a manual build still runs when release-please was skipped entirely.
    if: >-
      always() &&
      (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # A release builds the tag release-please just created, not the branch head, so the
      # package cannot contain anything the release does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}

      - name: Derive the version
        id: version
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          [ -n "${VERSION}" ] || VERSION="${{ inputs.version }}"
          [ -n "${VERSION}" ] || VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ghspot ${VERSION} for ${{ matrix.arch }}"

      # Built in a container, the same way it builds locally, so there is only one path to
      # keep working. The runner's own architecture decides the package architecture.
      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/deb/build-in-docker.sh

      - name: Verify the package on a clean system
        run: packaging/deb/verify.sh "dist/ghspot_${{ steps.version.outputs.version }}-1_${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghspot-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Attach packages to the release
    needs: [runner, release-please, build]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    permissions:
      contents: write

    # This job wants the built packages, not the source, so it does not check the repository
    # out. `gh` otherwise infers which repository it is acting on from the git remote, and
    # without one it fails with "not a git repository" — which reads like a broken checkout
    # rather than a missing setting. GH_REPO tells it directly.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ghspot-*-deb
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      # release-please has already created the release with the changelog as its notes, so
      # this uploads to it and appends installation instructions rather than replacing them.
      - name: Upload the packages
        run: gh release upload "${TAG}" dist/*.deb dist/SHA256SUMS --clobber

      - name: Append the installation notes
        run: |
          NOTES="$(mktemp)"
          gh release view "${TAG}" --json body --jq .body > "${NOTES}"
          cat >> "${NOTES}" <<'BODY'

          ---

          ## Install

          ```bash
          # Pick the package for your architecture, then:
          sudo apt install ./ghspot_*.deb
          ```

          The package bundles its own Python, so it does not depend on the system
          interpreter and works on any glibc distribution — Debian and Ubuntu alike.

          It installs but does not start the daemon: it needs a repository and a
          credential first. `sudo ghspot doctor --config /etc/ghspot/config.toml`
          tells you what is missing.

          - [Setting up a token or a GitHub App](https://tguisep.github.io/gh-spot-docker-runners/start/authentication/)
          - [Documentation](https://tguisep.github.io/gh-spot-docker-runners/)

          Verify a download against `SHA256SUMS`.
          BODY

          gh release edit "${TAG}" --notes-file "${NOTES}"
