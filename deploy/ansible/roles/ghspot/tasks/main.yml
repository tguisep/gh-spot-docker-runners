---
# Fail on a misconfiguration before touching the host, rather than halfway through.
- name: Check the configuration makes sense
  ansible.builtin.assert:
    that:
      - ghspot_pools | length > 0
      - (ghspot_github_token | length > 0) or (ghspot_github_app_id | length > 0)
      - not ((ghspot_github_token | length > 0) and (ghspot_github_app_id | length > 0))
      - (ghspot_github_app_id | length == 0) or (ghspot_github_app_private_key | length > 0)
    fail_msg: >-
      ghspot needs at least one pool in ghspot_pools, and exactly one credential:
      ghspot_github_token, or ghspot_github_app_id together with
      ghspot_github_app_private_key.
    quiet: true

- name: Install Docker
  when: ghspot_install_docker | bool
  block:
    - name: Install Docker's prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true

    - name: Add Docker's signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker's repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

- name: Require Docker to be present
  ansible.builtin.command: docker version --format '{% raw %}{{.Server.Version}}{% endraw %}'
  register: ghspot_docker_version
  changed_when: false
  failed_when: ghspot_docker_version.rc != 0

# --- the package -------------------------------------------------------------------------

- name: Resolve the release to install
  when: ghspot_deb_local | length == 0
  block:
    - name: Ask GitHub for the release
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ ghspot_repo }}/releases/{{
            'latest' if ghspot_version == 'latest' else 'tags/v' + ghspot_version
          }}
        return_content: true
      register: ghspot_release

    - name: Pick the package for this architecture
      ansible.builtin.set_fact:
        ghspot_deb_asset: >-
          {{ ghspot_release.json.assets
             | selectattr('name', 'search', '_' + (
                 ansible_architecture
                 | replace('x86_64', 'amd64')
                 | replace('aarch64', 'arm64')
               ) + '\.deb$') | first }}

    # Cached under its own name rather than downloaded to /tmp and deleted. Deleting it made
    # every run download 35 MB again and report a change, so the role was never idempotent —
    # and a role you cannot re-run without it claiming to have done something is a role you
    # stop trusting. The filename carries the version, so an upgrade still fetches.
    - name: Keep downloaded packages somewhere stable
      ansible.builtin.file:
        path: /var/cache/ghspot
        state: directory
        mode: "0755"

    - name: Download it
      ansible.builtin.get_url:
        url: "{{ ghspot_deb_asset.browser_download_url }}"
        dest: "/var/cache/ghspot/{{ ghspot_deb_asset.name }}"
        mode: "0644"

    - name: Note where it landed
      ansible.builtin.set_fact:
        ghspot_deb_path: "/var/cache/ghspot/{{ ghspot_deb_asset.name }}"

- name: Use a locally built package instead
  when: ghspot_deb_local | length > 0
  block:
    - name: Keep it somewhere stable too
      ansible.builtin.file:
        path: /var/cache/ghspot
        state: directory
        mode: "0755"

    - name: Copy it
      ansible.builtin.copy:
        src: "{{ ghspot_deb_local }}"
        dest: "/var/cache/ghspot/{{ ghspot_deb_local | basename }}"
        mode: "0644"

    - name: Note where it landed
      ansible.builtin.set_fact:
        ghspot_deb_path: "/var/cache/ghspot/{{ ghspot_deb_local | basename }}"

# The package creates the ghspot user, the systemd unit and /etc/ghspot, and deliberately
# does not start anything. apt compares versions, so re-running installs nothing.
- name: Install ghspot
  ansible.builtin.apt:
    deb: "{{ ghspot_deb_path }}"
    state: present
  notify: Restart ghspot

# --- configuration -----------------------------------------------------------------------

- name: Write the configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/ghspot/config.toml
    owner: root
    group: ghspot
    mode: "0640"
  notify: Restart ghspot

# One file per pool, when asked for. The main file then carries only `include`, and each
# pool is reviewable on its own rather than as a diff against one growing file.
- name: Write the pools one file each
  when: ghspot_pools_in_directory | bool
  block:
    - name: Create the pool directory
      ansible.builtin.file:
        path: "{{ ghspot_pools_directory }}"
        state: directory
        owner: root
        group: ghspot
        mode: "0750"

    - name: Write each pool
      ansible.builtin.template:
        src: pool.toml.j2
        dest: "{{ ghspot_pools_directory }}/{{ item.name }}.toml"
        owner: root
        group: ghspot
        mode: "0640"
      loop: "{{ ghspot_pools }}"
      loop_control:
        loop_var: pool
        label: "{{ pool.name }}"
      vars:
        item: "{{ pool }}"
      notify: Restart ghspot

    # A pool removed from the inventory must lose its file, or the daemon keeps serving it:
    # the include is a glob, and nothing else would ever delete it.
    - name: Find pool files that no longer belong to a pool
      ansible.builtin.find:
        paths: "{{ ghspot_pools_directory }}"
        patterns: "*.toml"
      register: ghspot_pool_files

    - name: Remove them
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ghspot_pool_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename | splitext | first) not in (ghspot_pools | map(attribute='name') | list)
      notify: Restart ghspot

# Written with no_log, because the whole point of this file is that it holds a credential.
- name: Write the credential
  ansible.builtin.template:
    src: env.j2
    dest: /etc/ghspot/env
    owner: root
    group: ghspot
    mode: "0640"
  no_log: true
  notify: Restart ghspot

# --- runner images -----------------------------------------------------------------------

- name: Build the runner images
  when: ghspot_build_images | bool
  block:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    - name: Check out the source the images are built from
      ansible.builtin.git:
        repo: "https://github.com/{{ ghspot_repo }}.git"
        dest: "{{ ghspot_checkout }}"
        version: "{{ 'main' if ghspot_version == 'latest' else 'v' + ghspot_version }}"
        depth: 1
        force: true

    - name: Find out which images are already built
      ansible.builtin.command: docker image inspect ghspot/runner:{{ item }}
      loop: "{{ ghspot_images }}"
      register: ghspot_image_present
      changed_when: false
      failed_when: false

    # Several minutes each, so already-present images are left alone unless forced.
    - name: Build them
      ansible.builtin.command:
        cmd: "{{ ghspot_checkout }}/images/runner/build.sh {{ item.item }}"
        chdir: "{{ ghspot_checkout }}"
      loop: "{{ ghspot_image_present.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0 or (ghspot_images_force | bool)
      changed_when: true
      # Building four variants on a modest host is not quick.
      async: 3600
      poll: 15

# --- the service -------------------------------------------------------------------------

- name: Enable and start ghspot
  ansible.builtin.systemd:
    name: ghspot
    enabled: "{{ ghspot_service_enabled | bool }}"
    state: "{{ ghspot_service_state }}"
    daemon_reload: true

# --- the dashboard -------------------------------------------------------------------------
#
# Nothing installs it: it rides in the package. What this does is tell the operator whether
# they got one, and where it is — an api_bind with no dashboard behind it is a silent 404 at
# a URL the README says will work.

- name: Look for the dashboard
  ansible.builtin.stat:
    path: "{{ (ghspot_web_root | length > 0) | ternary(ghspot_web_root, '/usr/share/ghspot/web') }}/index.html"
  register: ghspot_dashboard

- name: Say where the dashboard is
  when: ghspot_api_bind | length > 0 and ghspot_dashboard.stat.exists
  ansible.builtin.debug:
    msg: >-
      dashboard: http://{{ ghspot_api_bind }}/ui — no authentication, so reach it over a
      tunnel unless the bind address is already private:
      ssh -L {{ ghspot_api_bind.split(':') | last }}:{{ ghspot_api_bind }} {{ inventory_hostname }}

- name: Warn when the API is served without a dashboard behind it
  when: ghspot_api_bind | length > 0 and not ghspot_dashboard.stat.exists
  ansible.builtin.debug:
    msg: >-
      the API is bound to {{ ghspot_api_bind }} but no dashboard is installed, so /ui will
      404. The package was built on a machine without npm. The API itself is unaffected.

- name: Note that the dashboard is installed but not reachable
  when: ghspot_api_bind | length == 0 and ghspot_dashboard.stat.exists
  ansible.builtin.debug:
    msg: >-
      a dashboard is installed but ghspot_api_bind is unset, so nothing is served. Set it to
      127.0.0.1:8770 to reach it over a tunnel.

- name: Check the daemon is happy with what it was given
  ansible.builtin.command: ghspot doctor --config /etc/ghspot/config.toml
  register: ghspot_doctor
  changed_when: false
  failed_when: false

- name: Report what doctor found
  ansible.builtin.debug:
    msg: "{{ ghspot_doctor.stdout_lines }}"

- name: Fail if the daemon cannot work
  when: ghspot_verify | bool
  ansible.builtin.assert:
    that: ghspot_doctor.rc == 0
    fail_msg: >-
      ghspot doctor reported a problem — see the output above. The service is installed but
      will not be able to start runners until it is fixed. Set ghspot_verify: false to
      configure a host before its credential exists.
    quiet: true
