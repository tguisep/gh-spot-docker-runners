# ghspot — self-hosted GitHub Actions runners on Docker
#
# Copy to ./config.toml, ~/.config/ghspot/config.toml or /etc/ghspot/config.toml,
# then check it with: ghspot config validate

# Pools may live in their own files, one per file in a directory. Uncomment,
# drop one [[pool]] per file into that directory, and they are added to whatever is defined
# below.
#
#   include = "pools.d/*.toml"
#
# The glob is expanded and sorted, so the fleet does not depend on the order a directory
# happens to return. Files are *merged*: every pool found is a pool that runs, and two pools
# of one name is a fatal error naming both files rather than one silently winning. An
# included file defines pools and nothing else — [github], [daemon] and the rest stay here.
#
# This has to sit above the first [section]: in TOML a bare key belongs to whichever table
# precedes it, so written lower down it would quietly become part of that table.

[github]
# Two ways to authenticate. Credentials are never read from this file itself — it points
# at files, or you set the environment variables (the environment always wins).
#
# Full walkthrough for both, with the exact permissions:
# https://tguisep.github.io/gh-spot-docker-runners/start/authentication/

# --- Option A: personal access token -------------------------------------------------
# Quickest to set up. A fine-grained token scoped to the repositories below, with:
#   Administration: read & write   (required to mint just-in-time runner configs)
#   Actions:        read           (required to see queued jobs)
# Or set GHSPOT_GITHUB_TOKEN.
token_file = "~/.config/ghspot/token"

# --- Option B: GitHub App (preferred) ------------------------------------------------
# Better in every respect that matters here: the rate limit belongs to the installation
# rather than to you personally, the permissions are the app's rather than everything your
# account can reach, and its tokens expire hourly on their own.
#
# Create one at Settings -> Developer settings -> GitHub Apps, with repository permissions
# "Administration: read & write" and "Actions: read", then install it on your account and
# select *only* the repositories it should serve. "All repositories" is the default and is
# almost never what you want.
#
# app_id = "123456"
# private_key_file = "~/.config/ghspot/app.pem"    # or set GHSPOT_GITHUB_APP_PRIVATE_KEY
#
# Optional. Discovered automatically when the app has a single installation, or from the
# first repository below.
# installation_id = 98765432

# api_url = "https://api.github.com"       # change for GitHub Enterprise Server
# request_timeout = "20s"

[daemon]
poll_interval = "15s"
state_db = "~/.local/state/ghspot/state.db"

# What to call this machine in reports.
#
# Several hosts can serve one repository, and each daemon only ever sees its own runners — so
# every number `ghspot stats` prints is about this box alone. Naming it is what lets you put
# two of those reports side by side.
#
# Defaults to the system hostname. Set it when that is meaningless (a cloud instance id) or
# not unique (a container's).
# host = "builders-01"

# Serve the REST API. Bind to localhost unless you have put auth in front of it.
# api_bind = "127.0.0.1:8770"

# stop_timeout = "30s"                     # grace given to a draining runner
# log_level = "INFO"
# log_format = "auto"                      # auto | console | json

# Reclaiming what jobs leave on this host.
#
# Jobs reach the host's Docker daemon through the mounted socket, so the images they build,
# the images they pull and the volumes they create outlive them — removing the runner
# container does not take those with it.
#
# This bounds that. It does not eliminate it: a job that leaves a container *running* is
# never touched, because nothing tells it apart from something you started yourself. Genuine
# zero-residue needs each runner to have its own Docker daemon, which is a different
# architecture. See https://tguisep.github.io/gh-spot-docker-runners/guides/housekeeping/.
[housekeeping]
# enabled = true
# every = "1h"                     # wall clock, not ticks

# Nothing younger than these is touched, so a running job cannot lose what it is using.
# containers_older_than = "1h"     # stopped only; "never" to disable
# images_older_than = "24h"        # unused images. Runner images are labelled and exempt.
# volumes = true                   # anonymous volumes only; named ones are yours
# build_cache_older_than = "24h"
# keep_build_cache = "10g"         # kept below this, or every rebuild starts cold

# ---------------------------------------------------------------- host capacity
#
# max_runners bounds one pool. Nothing bounds the *machine*: four pools with room to spare
# will each start runners at the same time, on one box. This is where you say what the host
# will take.
#
# Every key is optional and unset means unlimited, so leaving the section out behaves exactly
# as it did before it existed.
#
# [capacity]

# Ceilings on what is *committed* — arithmetic over the runners that exist, needing no
# measurement. max_containers is the one that always applies; the other two only count pools
# that set cpus and memory.
# Defaults to this machine's core count — an unbounded host starts a container per queued
# job until it stops responding. "unlimited" lifts it on purpose.
# max_containers = 8
# max_cpus = 12.0
# max_memory = "24g"

# Ceilings on what is *measured*. At or above these nothing new starts, even where a pool has
# a free slot — this is what catches what the arithmetic cannot: everything else on the box,
# or a job using far more than its pool reserved.
#
# CPU is the one-minute load average as a percentage of cores, so 100 means as much work
# queued as the machine has cores. Memory ignores the page cache, which the kernel hands back
# on demand.
# cpu_high_water = 85
# memory_high_water = 90

[[pool]]
name = "default"
repository = "tguisep/my-project"

# A job runs here when every label it asks for appears in this list.
#
# Name the operating system precisely, the way GitHub's own hosted runners do, so a workflow
# can ask for what it actually needs:
#
#     runs-on: [self-hosted, ubuntu-24.04]
#
# "linux" and "x64" are conventional and worth keeping; a bare "linux" alone is not, because
# a job asking for it has no idea what it will get.
labels = ["self-hosted", "linux", "x64", "ubuntu-24.04"]

# Labels a job must ask for *by name* before this pool serves it.
#
# Label matching is a subset rule, so a pool carrying extra labels serves jobs that never
# mentioned them. For an ordinary pool that is the point. For a scarce one — a GPU, or a
# machine with a licence attached — it means the thing you were protecting gets spent on
# work that never wanted it.
# requires_labels = ["gpu-a100"]

# How runners are kept. Three intentions, named — rather than
# assembled by hand out of min_idle and idle_timeout, where two of the three ways to write it
# would be subtly wrong:
#
#   dynamic    keep between min_idle and max_idle warm, growing to cover the queue. The
#              default, and what the daemon has always done.
#   static     exactly max_runners, always up, never reaped. Fastest first job, paid for
#              continuously. min_idle, max_idle and idle_timeout do not apply.
#   ondemand   nothing warm; a runner starts when a job is queued and goes after
#              idle_timeout. Cheapest, and every job pays container boot time.
#
# A key that does not apply to the chosen mode is refused rather than ignored.
# pm = "dynamic"

# This pool's share of contested capacity, when [capacity] bites. A weight, not a rank: at 10
# against another pool's 5 this one takes two thirds of the contested slots, not all of them,
# and the slots are interleaved — the lighter pool keeps starting runners rather than waiting
# for this one to be satisfied.
#
# Starts at 1, which is the default, so with capacity to spare it changes nothing. A pool
# that stops wanting runners gives its share back.
# priority = 10

min_idle = 1          # runners kept warm so a job doesn't wait for a container to boot

# Warm runners above this are reaped without waiting out idle_timeout — an upper bound on the
# warm band. Unset, only the timeout bounds them — so a burst leaves the whole pool
# warm for its full length on a host that has gone back to needing one.
# max_idle = 3
max_runners = 4       # hard ceiling for this pool
idle_timeout = "10m"  # reap runners idle longer than this, never below min_idle
max_job_duration = "2h"
max_launch_per_tick = 2   # spreads a large matrix across ticks

[pool.container]
# The image tag and the OS label above are the same string, deliberately: build with
# `ghspot image build ubuntu-24.04` and the two cannot drift apart.
#
# Available: ubuntu-24.04, ubuntu-22.04, rhel-9, rhel-10
image = "ghspot/runner:ubuntu-24.04"
cpus = 2.0
memory = "4g"

# Let jobs run docker build / docker run. See SECURITY.md: a job with socket access
# has effective root on this host. Fine for your own repositories.
docker_socket = true

# GPUs for the job. Needs the NVIDIA Container Toolkit on this host — `ghspot doctor` says
# so if it is missing, rather than letting every runner in the pool fail to start.
#
#   gpus = "all"          every GPU
#   gpus = 1              any one of them
#   gpus = ["0", "1"]     these, as `nvidia-smi -L` numbers them
#
# Unset, jobs get no GPU. That is the right default: a runner holding a GPU it does not need
# holds it against every other runner on the machine. Give a GPU pool its own label, so only
# jobs that need one land there.
# gpus = "all"

# Persist caches between runs. Host path = container path.
# [pool.container.volumes]
# "/srv/ghspot/cache" = "/home/runner/.cache"

# Extra environment for jobs. Anything token-shaped is refused at load time —
# job secrets belong in GitHub Actions secrets, not here.
# [pool.container.environment]
# TZ = "Europe/Paris"

# A second pool, for a different repository or a different machine shape.
# A second pool serving a different operating system. Pools are how you offer more than one:
# a job asking for rhel-9 will only ever land on a runner that has it.
#
# [[pool]]
# name = "rhel"
# repository = "tguisep/my-project"
# labels = ["self-hosted", "linux", "x64", "rhel-9"]
# max_runners = 1
# [pool.container]
# image = "ghspot/runner:rhel-9"
# docker_socket = true
