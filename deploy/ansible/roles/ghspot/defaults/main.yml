---
# Where the package comes from.
#
# By default the latest published release. Set ghspot_version to pin one, or
# ghspot_deb_local to install a file you built yourself — useful before a release exists.
ghspot_version: latest
ghspot_deb_local: ""
ghspot_repo: tguisep/gh-spot-docker-runners

# Docker. Left alone by default: a host that runs runners usually has it already, and
# installing it under someone is rude.
ghspot_install_docker: false

# Runner images.
#
# There is no public registry for these, so they are built on the host — by `ghspot image
# build`, from the sources the package installs, so no checkout is needed. Building takes
# several minutes per variant, so the role skips any already present unless
# ghspot_images_force is set.
ghspot_build_images: true
ghspot_images: [ubuntu-24.04]
ghspot_images_force: false

# Credentials. Supply exactly one. Keep them in ansible-vault, not in a playbook.
#
#   ghspot_github_token: "{{ vault_ghspot_token }}"
# or
#   ghspot_github_app_id: "123456"
#   ghspot_github_app_private_key: "{{ vault_ghspot_app_key }}"
ghspot_github_token: ""
ghspot_github_app_id: ""
ghspot_github_app_private_key: ""

# Daemon configuration, rendered into /etc/ghspot/config.toml.
ghspot_api_url: https://api.github.com
ghspot_poll_interval: 15s
ghspot_state_db: /var/lib/ghspot/state.db
# The REST API, and with it the web dashboard at /ui. Unset means neither is served and no
# port is opened, which is the right default for a machine nobody asked to expose.
#
# There is no authentication on either. "127.0.0.1:8770" keeps it on the host, reachable
# over an SSH tunnel:  ssh -L 8770:localhost:8770 the-host
ghspot_api_bind: ""

# What this machine is called in reports. Empty means the daemon uses the system hostname,
# which is right until the hostname is a cloud instance id nobody recognises. Several hosts
# can serve one repository and each daemon counts only its own runners, so this is what makes
# two reports comparable.
ghspot_host: ""
ghspot_log_level: INFO

# Where the daemon looks for the built dashboard. Empty means the packaged location, which
# is what the .deb installs and what almost everyone wants. Set it only when serving a build
# from somewhere else.
ghspot_web_root: ""

# Reclaiming what jobs leave on the host.
#
# Jobs reach the host's Docker daemon through the mounted socket, so what they build, pull
# and create outlives them. This bounds that; it does not eliminate it — a container a job
# leaves *running* is never touched. See https://tguisep.github.io/gh-spot-docker-runners/guides/housekeeping/.
#
# Any age may be "never" to turn that sweep off; enabled: false turns off all of it.
ghspot_housekeeping:
  enabled: true
  every: 1h
  containers_older_than: 1h    # stopped containers only
  images_older_than: 24h       # unused images; runner images are exempt by label
  volumes: true                # anonymous volumes only; named ones are yours
  build_cache_older_than: 24h
  keep_build_cache: 10g        # cache below this is kept, or rebuilds start cold

# Where the pools are written. Together in config.toml by default, or one file each in
# /etc/ghspot/pools.d — the php-fpm arrangement — which keeps a host's pools reviewable one
# at a time rather than as a diff against a single growing file.
ghspot_pools_in_directory: false
ghspot_pools_directory: /etc/ghspot/pools.d
# What the host will take, across every pool at once.
#
# max_runners bounds one pool; nothing bounds the machine, so four pools with room to spare
# each start runners on the same box. Every key is optional, and unset means unlimited.
#
#   max_containers / max_cpus / max_memory   arithmetic over what is committed
#   cpu_high_water / memory_high_water       percentages of what is measured; at or above
#                                            them nothing new starts until the host recovers
ghspot_capacity: {}

# The pools this host serves. At least one is required.
#
# ghspot_pools:
#   - name: default
#     repository: you/your-project
#     labels: [self-hosted, linux, x64, ubuntu-24.04]
#     min_idle: 1
#     max_runners: 4
#     container:
#       image: ghspot/runner:ubuntu-24.04
#       cpus: 2.0
#       memory: 4g
#       docker_socket: true
#
# `pm` on a pool picks how its runners are kept, as php-fpm's: "dynamic" (a warm band between
# min_idle and max_idle, the default), "static" (exactly max_runners, never reaped) or
# "ondemand" (nothing warm). A key that does not apply to the mode is refused at load.
#
# `priority: 10` on a pool is its share of contested capacity when ghspot_capacity bites —
# a weight, not a rank. Against another pool at 5 it takes two thirds of the contested slots,
# interleaved, not all of them. From 1, which is the default.
ghspot_pools: []

# Whether to start the service. Set false to configure a host without running it yet.
ghspot_service_enabled: true
ghspot_service_state: started

# Whether a run must end with a working daemon.
#
# `ghspot doctor` runs either way and its output is always shown; this decides whether its
# verdict fails the play. Set false to configure a host before its credential exists — or in
# a test, where there is no real repository to reach.
ghspot_verify: true
