name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: unit and integration tests
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing

  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the runner image
        run: docker build -t ghspot/runner:ci docker/runner/
      - name: the image must not carry a token
        run: |
          docker run --rm ghspot/runner:ci env | grep -qiE 'token|jitconfig' && exit 1 || exit 0
