name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_hosted:
        description: "Run everything on GitHub-hosted runners, ignoring the self-hosted fleet."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # Decide where the rest of this workflow runs.
  #
  # This repository is public, and GitHub is explicit that self-hosted runners and public
  # repositories are a dangerous combination: anyone can fork, open a pull request, and have
  # their workflow execute on the runner. Our runners mount the host Docker socket, which is
  # root on that machine — so a fork pull request must never reach them.
  #
  # push and same-repository pull requests both require write access, so they are safe.
  # Everything else falls back to GitHub-hosted, where a stranger's code is Microsoft's
  # problem rather than yours.
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      where: ${{ steps.pick.outputs.where }}
    steps:
      - id: pick
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          FORCE_HOSTED: ${{ inputs.force_hosted }}
        run: |
          if [ "${IS_FORK}" = "true" ]; then
            REASON="pull request from a fork"
          elif [ "${FORCE_HOSTED}" = "true" ]; then
            REASON="requested with force_hosted"
          fi

          if [ -n "${REASON:-}" ]; then
            echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "where=GitHub-hosted (${REASON})" >> "$GITHUB_OUTPUT"
          else
            echo 'labels=["self-hosted","linux","x64","home-vm"]' >> "$GITHUB_OUTPUT"
            echo "where=self-hosted" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: echo "Running on ${{ steps.pick.outputs.where }}"

  lint:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: unit and integration tests
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing

  # Runs on the self-hosted fleet too. `docker build` streams its context from the client, so
  # it works over the mounted socket; jobs that bind-mount a workspace path do not, and stay
  # on GitHub-hosted (see below).
  runner-image:
    name: Runner image (${{ matrix.variant }})
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu-24.04, ubuntu-22.04, rhel-9, rhel-10]
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: images/runner/build.sh ${{ matrix.variant }}

      # The property the whole design rests on: a job never sees a credential.
      - name: the image must not carry a token
        run: |
          docker run --rm --entrypoint env ghspot/runner:${{ matrix.variant }} \
            | grep -qiE 'token|jitconfig' && exit 1 || exit 0

      # Without a config the entrypoint must refuse, rather than starting a runner that
      # cannot register.
      - name: it refuses to start without a configuration
        run: |
          docker run --rm ghspot/runner:${{ matrix.variant }} >/dev/null 2>&1
          test $? -eq 64

      # A mismatched group id here surfaces later as a job failing on the Docker socket,
      # which looks nothing like a build problem. The RHEL packages create their own docker
      # group, so this is a real hazard rather than a theoretical one.
      - name: the docker group id matches the host
        run: |
          EXPECTED="$(getent group docker | cut -d: -f3)"
          ACTUAL="$(docker run --rm --entrypoint sh ghspot/runner:${{ matrix.variant }} \
                      -c 'getent group docker | cut -d: -f3')"
          test "${EXPECTED}" = "${ACTUAL}" \
            || { echo "::error::docker gid ${ACTUAL} != host ${EXPECTED}"; exit 1; }

      - name: it runs unprivileged and has the runner payload
        run: |
          docker run --rm --entrypoint sh ghspot/runner:${{ matrix.variant }} -c '
            test "$(id -u)" != "0" || { echo "runs as root"; exit 1; }
            test -f run.sh || { echo "no runner payload"; exit 1; }
            docker --version >/dev/null || { echo "no docker cli"; exit 1; }
            git --version >/dev/null || { echo "no git"; exit 1; }
          ' 

  # A NOTE FOR JOBS ADDED LATER
  #
  # Any job that runs `docker run -v "${PWD}:/src"` must stay pinned to `ubuntu-latest`
  # rather than using select-runner. On a self-hosted runner the Docker client sits inside a
  # container talking to the *host's* daemon, so a workspace path is resolved on the host,
  # where it does not exist. Docker silently mounts an empty directory and the job fails in a
  # confusing way. `docker build` is fine — it streams its context from the client.
  #
  # Moving those jobs would need the runner's work directory to be a host bind mount at an
  # identical path inside the container, which is a separate change to the runner image.

  install-docs:
    name: Documented install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs the commands docs/operations.md tells people to run, on a clean system.
      # They were wrong three times running; reasoning about them evidently does not work.
      - run: packaging/verify-source-install.sh

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same container build used locally, so there is only one path to keep working.
      - name: build
        run: packaging/deb/build-in-docker.sh
      # Verified on a newer Ubuntu than the builder, which is the point of bundling the
      # interpreter: a regression here means the package would break on any host whose
      # python differs from the runner's.
      - name: verify on a clean system
        run: packaging/deb/verify.sh dist/*.deb
