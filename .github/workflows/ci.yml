name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_hosted:
        description: "Run everything on GitHub-hosted runners, ignoring the self-hosted fleet."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # Decide where the rest of this workflow runs.
  #
  # This repository is public, and GitHub is explicit that self-hosted runners and public
  # repositories are a dangerous combination: anyone can fork, open a pull request, and have
  # their workflow execute on the runner. Our runners mount the host Docker socket, which is
  # root on that machine — so a fork pull request must never reach them.
  #
  # push and same-repository pull requests both require write access, so they are safe.
  # Everything else falls back to GitHub-hosted, where a stranger's code is Microsoft's
  # problem rather than yours.
  # Work out what this change actually touches, so a documentation edit does not rebuild four
  # runner images and a Debian package.
  #
  # Done with git rather than a paths-filter action: it is a dozen lines, it is auditable,
  # and adding a third-party action to a workflow that runs on a self-hosted fleet is a
  # supply-chain decision worth avoiding for something this small.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      images: ${{ steps.filter.outputs.images }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE}" ]; then
            CHANGED="$(git diff --name-only "${BASE}...HEAD")"
          else
            # A push. Compare against the previous commit; on the very first one, or a force
            # push, fall back to treating everything as changed rather than guessing.
            CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)"
          fi

          echo "Changed files:"
          echo "${CHANGED}" | sed 's/^/  /'

          matches() { echo "${CHANGED}" | grep -qE "$1"; }

          # A change to the workflow itself runs everything: the point of the change may be
          # the jobs it gates.
          if matches '^\.github/workflows/'; then
            echo "a workflow changed — running everything"
            {
              echo "python=true"; echo "images=true"; echo "packaging=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matches '^(src/|tests/|pyproject\.toml|uv\.lock)' \
            && echo "python=true" >> "$GITHUB_OUTPUT" \
            || echo "python=false" >> "$GITHUB_OUTPUT"

          matches '^images/runner/' \
            && echo "images=true" >> "$GITHUB_OUTPUT" \
            || echo "images=false" >> "$GITHUB_OUTPUT"

          # Packaging embeds the application, so it is rebuilt when the application changes.
          # docs/operations.md is in here because install-docs exists to run the commands
          # that file tells people to run — editing them without checking them is exactly
          # how they were wrong three times.
          matches '^(packaging/|deploy/|src/|pyproject\.toml|uv\.lock|docs/operations\.md)' \
            && echo "packaging=true" >> "$GITHUB_OUTPUT" \
            || echo "packaging=false" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "| Area | Runs |"
            echo "|---|---|"
            echo "| python | ${{ steps.filter.outputs.python }} |"
            echo "| images | ${{ steps.filter.outputs.images }} |"
            echo "| packaging | ${{ steps.filter.outputs.packaging }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      where: ${{ steps.pick.outputs.where }}
    steps:
      - id: pick
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          FORCE_HOSTED: ${{ inputs.force_hosted }}
        run: |
          if [ "${IS_FORK}" = "true" ]; then
            REASON="pull request from a fork"
          elif [ "${FORCE_HOSTED}" = "true" ]; then
            REASON="requested with force_hosted"
          fi

          if [ -n "${REASON:-}" ]; then
            echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "where=GitHub-hosted (${REASON})" >> "$GITHUB_OUTPUT"
          else
            echo 'labels=["self-hosted","linux","x64","home-vm"]' >> "$GITHUB_OUTPUT"
            echo "where=self-hosted" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: echo "Running on ${{ steps.pick.outputs.where }}"

  lint:
    needs: [changes, select-runner]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    needs: [changes, select-runner]
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: unit and integration tests
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing

  # Runs on the self-hosted fleet too. `docker build` streams its context from the client, so
  # it works over the mounted socket; jobs that bind-mount a workspace path do not, and stay
  # on GitHub-hosted (see below).
  # Pinned to GitHub-hosted rather than using select-runner, for three reasons that all
  # point the same way:
  #
  #   - the images CI builds are throwaway, so nothing is gained by building them on the
  #     fleet host;
  #   - four variants at roughly 2.7 GB each, every run, fills a home server;
  #   - rhel-10 needs the x86-64-v3 microarchitecture level, which a VM presenting a generic
  #     CPU does not have — so that variant simply cannot build on many self-hosted hosts.
  #
  # The REGISTRY override and the cleanup step below are kept regardless, so that routing
  # this back onto the fleet later cannot quietly replace the images real jobs run in.
  runner-image:
    name: Runner image (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu-24.04, ubuntu-22.04, rhel-9, rhel-10]
    steps:
      - uses: actions/checkout@v4

      # Built under a separate name from the images the daemon runs jobs in.
      #
      # On a self-hosted runner this builds against the *host's* Docker daemon — the same one
      # serving the fleet. Using the operational tag would mean a pull request's CI silently
      # replacing the image real jobs run in, and a broken branch taking the fleet with it.
      - name: build
        env:
          REGISTRY: ghspot/runner-ci
        run: images/runner/build.sh ${{ matrix.variant }}

      # Checks the contract and the toolset. A missing tool does not fail a build — it fails
      # somebody's workflow later, with an error pointing nowhere near the image.
      - name: verify
        env:
          REGISTRY: ghspot/runner-ci
        run: images/runner/verify.sh ${{ matrix.variant }}

      # Self-hosted runners keep what they build. Four variants at ~2.7 GB each, every run,
      # fills a home server quickly. The build cache is left alone, so rebuilds stay fast.
      - name: clean up
        if: always()
        run: |
          docker image rm -f "ghspot/runner-ci:${{ matrix.variant }}" 2>/dev/null || true
          docker image prune -f >/dev/null 2>&1 || true

  # A NOTE FOR JOBS ADDED LATER
  #
  # Any job that runs `docker run -v "${PWD}:/src"` must stay pinned to `ubuntu-latest`
  # rather than using select-runner. On a self-hosted runner the Docker client sits inside a
  # container talking to the *host's* daemon, so a workspace path is resolved on the host,
  # where it does not exist. Docker silently mounts an empty directory and the job fails in a
  # confusing way. `docker build` is fine — it streams its context from the client.
  #
  # Moving those jobs would need the runner's work directory to be a host bind mount at an
  # identical path inside the container, which is a separate change to the runner image.

  install-docs:
    name: Documented install
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs the commands docs/operations.md tells people to run, on a clean system.
      # They were wrong three times running; reasoning about them evidently does not work.
      - run: packaging/verify-source-install.sh

  deb:
    name: Debian package
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same container build used locally, so there is only one path to keep working.
      - name: build
        run: packaging/deb/build-in-docker.sh
      # Verified on a newer Ubuntu than the builder, which is the point of bundling the
      # interpreter: a regression here means the package would break on any host whose
      # python differs from the runner's.
      - name: verify on a clean system
        run: packaging/deb/verify.sh dist/*.deb

  # One check for branch protection to require.
  #
  # A skipped job reports neither success nor failure, so requiring the jobs themselves would
  # leave a documentation-only pull request waiting forever on builds that were correctly
  # skipped. This gathers them: skipped is fine, failed is not.
  ci:
    name: CI
    if: always()
    needs: [changes, lint, test, runner-image, install-docs, deb]
    runs-on: ubuntu-latest
    steps:
      - name: Check nothing failed
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "::error::a required job reported '${result}'"; exit 1 ;;
            esac
          done
          echo "nothing failed"
